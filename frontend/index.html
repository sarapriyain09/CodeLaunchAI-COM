<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#070b16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Codlearn Builder</title>
      <script>
        // Expose Vite env to static redirect pages under /app/.
        // This avoids ever doing billing on the Vite server.
        (function () {
          const raw = "%VITE_PUBLIC_SITE_URL%";
          let base = (raw || "").trim();
          if (!base || base === "%VITE_PUBLIC_SITE_URL%") base = window.location.origin;

          // Prevent cross-origin public-site links if the build-time env is stale.
          try {
            const parsed = new URL(base, window.location.origin);
            if (parsed.origin !== window.location.origin) base = window.location.origin;
          } catch {
            base = window.location.origin;
          }

          // @ts-ignore
          window.__PUBLIC_SITE_URL__ = base;
        })();
      </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
