<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Codlearn · Dashboard</title>
    <script>
      // Keep parity with frontend/index.html: public-site links should stay same-origin.
      (function () {
        const raw = "%VITE_PUBLIC_SITE_URL%";
        let base = (raw || "").trim();
        if (!base || base === "%VITE_PUBLIC_SITE_URL%") base = window.location.origin;

        try {
          const parsed = new URL(base, window.location.origin);
          if (parsed.origin !== window.location.origin) base = window.location.origin;
        } catch {
          base = window.location.origin;
        }

        // @ts-ignore
        window.__PUBLIC_SITE_URL__ = base;
      })();
    </script>
  </head>
  <body>
    <div class="chatgptApp" aria-label="Codlearn">
      <header class="topMenu">
        <a class="brand" href="/app/">Codlearn</a>

        <div class="menu">
          <label class="srOnly" for="projectSelect">Project</label>
          <select id="projectSelect"></select>
          <button id="newProject" class="btn" type="button">New</button>
          <a id="openPreview" class="btn" href="#" target="_blank" rel="noreferrer">Preview</a>
          <a class="btn" href="/subscribe.html">Subscribe</a>
        </div>

        <div class="account">
          <div class="userLine" id="userLine"></div>
          <input id="name" class="input" type="text" placeholder="Name (optional)" autocomplete="name" />
          <input id="email" class="input" type="email" placeholder="Email" autocomplete="email" />
          <button id="signIn" class="btn" type="button">Sign in</button>
          <button id="signOut" class="btn" type="button">Sign out</button>
        </div>
      </header>

      <div class="statusRow">
        <div id="projectStatus" class="dash-status" role="status"></div>
        <div id="authStatus" class="dash-status" role="status"></div>
      </div>

      <main class="chatCenter" aria-label="Chat">
        <div id="chatLog" class="chatLog" aria-live="polite"></div>

        <div class="composer">
          <textarea
            id="message"
            class="composerInput"
            rows="3"
            placeholder="Message Codlearn… (Ctrl+Enter to send)"
          ></textarea>
          <div class="composerActions">
            <button id="generate" class="btn primary" type="button">Generate</button>
            <button id="send" class="btn" type="button">Send</button>
            <button id="clearChat" class="btn" type="button">Clear</button>
          </div>
          <div id="chatStatus" class="dash-status" role="status"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/vanilla/dashboard.ts"></script>
  </body>
</html>
