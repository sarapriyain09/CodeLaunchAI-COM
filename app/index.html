    <meta charset="UTF-8" />

    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Codlearn</title>
      <script>
        // Expose Vite env to static redirect pages under /app/.
        // This avoids ever doing billing on the Vite server.
        (function () {
          const raw = "http://127.0.0.1:7080";
          let base = (raw || "").trim();
          if (!base || base === "http://127.0.0.1:7080") base = window.location.origin;

          // Prevent cross-origin public-site links if the build-time env is stale.
          try {
            const parsed = new URL(base, window.location.origin);
            if (parsed.origin !== window.location.origin) base = window.location.origin;
          } catch {
            base = window.location.origin;
          }

          // @ts-ignore
          window.__PUBLIC_SITE_URL__ = base;
        })();
      </script>
    <script type="module" crossorigin src="/app/assets/index-BwiECHpp.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/orchestrator-BGFUw1fi.js">
    <link rel="stylesheet" crossorigin href="/app/assets/orchestrator-q4OsH4hx.css">
  </head>
  <body class="lovable-bg">
    <div class="chatgptApp" aria-label="Codlearn">
      <header class="topBar" aria-label="Top navigation">
        <div class="topBarInner">
          <a class="topBrand" href="/app/">Codlearn</a>

          <nav class="topNav" aria-label="Primary">
            <a class="topNavLink" href="/app/">Home</a>
            <a id="openPreview" class="topNavLink" href="#" target="_blank" rel="noreferrer" hidden>Preview</a>
            <a class="topNavLink" href="/app/features.html">Features</a>
            <a class="topNavLink" href="/app/how-it-works.html">How it Works</a>
            <a class="topNavLink" href="/app/examples.html">Examples</a>
            <a class="topNavLink" href="/app/pricing.html">Pricing</a>
            <a class="topNavLink" href="/app/subscribe.html">Subscribe</a>
            <a class="topNavLink" href="/app/support.html">Support</a>
          </nav>

          <div class="topActions" aria-label="Account">
            <button id="signIn" class="topBtn" type="button">Log in</button>
            <button id="signOut" class="topBtn" type="button" hidden>Sign out</button>
          </div>
        </div>

      </header>

      <div class="appShell" aria-label="App">
        <aside id="leftPanel" class="sideMenu" aria-label="Project status" hidden>
          <div class="sideSectionTitle">Account</div>
          <div id="userLine" class="userLine"></div>
          <div id="authStatus" class="dash-status" role="status"></div>

          <div class="sideSectionTitle">Project</div>
          <div id="projectStatus" class="dash-status" role="status"></div>
        </aside>

        <div class="mainPane">
          <main class="chatCenter" aria-label="Chat">
            <div id="chatLog" class="chatLog" aria-live="polite"></div>

            <div class="composer">
              <textarea
                id="message"
                class="composerInput"
                rows="3"
                placeholder="Message Codlearn… (Ctrl+Enter to send)"
              ></textarea>
              <div class="composerActions">
                <button id="send" class="btn" type="button">Send</button>
                <button id="clearChat" class="btn" type="button">Clear</button>
                <button id="generate" class="btn primary" type="button">Generate</button>
              </div>
              <div id="chatStatus" class="dash-status" role="status"></div>
            </div>

            <!-- Hidden project controls (kept for app logic) -->
            <div style="display: none" aria-hidden="true">
              <label for="projectSelect">Project</label>
              <select id="projectSelect"></select>
              <button id="newProject" type="button">New</button>
            </div>
          </main>
        </div>
      </div>
    </div>

  </body>
</html>
