<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Codlearn · Dashboard</title>
    <script>
      // Keep parity with frontend/index.html: public-site links should stay same-origin.
      (function () {
        const raw = "http://127.0.0.1:7080";
        let base = (raw || "").trim();
        if (!base || base === "http://127.0.0.1:7080") base = window.location.origin;

        try {
          const parsed = new URL(base, window.location.origin);
          if (parsed.origin !== window.location.origin) base = window.location.origin;
        } catch {
          base = window.location.origin;
        }

        // @ts-ignore
        window.__PUBLIC_SITE_URL__ = base;
      })();
    </script>
    <script type="module" crossorigin src="/app/assets/dashboard-BP2fpE8E.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/index-CX2xs1Uv.js">
    <link rel="stylesheet" crossorigin href="/app/assets/index-VvDIVFBA.css">
    <link rel="stylesheet" crossorigin href="/app/assets/dashboard-C1yAF5mn.css">
  </head>
  <body>
    <div class="chatLayoutScreen">
      <div class="appShell">
        <aside class="sidebar" aria-label="Projects">
          <div class="sidebarTop">
            <div class="brand">
              <div class="logo" aria-hidden="true"></div>
              <div>Codlearn</div>
            </div>
          </div>

          <div class="sidebarActions">
            <button id="newProject" class="primaryBtn" type="button">+ New project</button>
            <a class="ghostBtn" href="/subscribe.html">Subscribe</a>
          </div>

          <div class="threadList" id="projectList" aria-label="Project list"></div>
          <div id="projectStatus" class="dash-status" role="status"></div>

          <div class="sidebarFooter" aria-label="Account">
            <div class="dash-muted" id="userLine"></div>
            <div style="margin-top: 10px">
              <label for="name">Name (optional)</label>
              <input id="name" type="text" placeholder="Your name" autocomplete="name" />
            </div>
            <div style="margin-top: 10px">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="dash-row" style="justify-content: flex-start">
              <button id="signIn" class="dash-btn dash-btn-primary" type="button">Sign in</button>
              <button id="signOut" class="dash-btn" type="button">Sign out</button>
            </div>
            <div id="authStatus" class="dash-status" role="status"></div>
          </div>
        </aside>

        <main class="main" aria-label="Chat">
          <div class="topbar">
            <div class="topbarTitle">
              <div class="title">Build with AI</div>
              <div class="subtitle">Describe your app, then generate a preview.</div>
            </div>
            <div class="topbarRight">
              <a id="openPreview" class="ghostBtn" href="#" target="_blank" rel="noreferrer">Open preview</a>
            </div>
          </div>

          <div class="chatArea">
            <div id="chatLog" class="messages" aria-live="polite"></div>
          </div>

          <div class="composerWrap">
            <div class="composer">
              <textarea
                id="message"
                class="input"
                rows="3"
                placeholder="Message Codlearn…"
              ></textarea>
              <button id="generate" class="sendBtn" type="button">Generate</button>
              <button id="send" class="ghostBtn" type="button">Send</button>
              <button id="clearChat" class="ghostBtn" type="button">Clear</button>
            </div>
            <div id="chatStatus" class="dash-status" role="status"></div>
          </div>
        </main>
      </div>
    </div>

    <!-- Hidden legacy element (kept for TS compatibility). -->
    <select id="projectSelect" style="display: none"></select>

  </body>
</html>
